<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>
  <h1>じゃんけん</h1>
  <a href="/logout">ログアウト</a>

  <div th:if="${entry}">
    <p>Hi [[${loginUser}]]</p>
    <h2>エントリー</h2>
    <ul>
      <li th:each="user : ${entry.users}">[[${user}]]</li>
    </ul>
  </div>
  <ul>
    <li><a th:href="@{/jankengame(hand='グー')}">グー</a></li>
    <li><a th:href="@{/jankengame(hand='チョキ')}">チョキ</a></li>
    <li><a th:href="@{/jankengame(hand='パー')}">パー</a></li>
  </ul>

  <div th:if="${janken != null}">
    <p>あなたの手 [[${janken.playerHand}]]</p>
    <p>相手の手 [[${janken.cpuHand}]]</p>
    <p>結果 [[${janken.result}]]</p>
  </div>

  <a href="/janken">jankenへのGETをリクエスト</a><br>
</body>



</html>
