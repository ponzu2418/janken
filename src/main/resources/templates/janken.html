<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>
  <h1>じゃんけん</h1>
  <a href="/logout">ログアウト</a>

  <div th:if="${entry}">
    <p>Hi [[${loginUser}]]</p>
    <h2>エントリー</h2>
    <ul>
      <li th:each="user : ${users}" th:text="${user.name}"></li>
    </ul>
  </div>
  <ul>
    <li><a th:href="@{/jankengame(hand='グー')}">グー</a></li>
    <li><a th:href="@{/jankengame(hand='チョキ')}">チョキ</a></li>
    <li><a th:href="@{/jankengame(hand='パー')}">パー</a></li>
  </ul>

  <h2>試合結果</h2>
  <ul>
    <li th:each="match : ${matches}">
      id:<span th:text="${match.id}"></span>
      user1:<span th:text="${match.user1}"></span>
      user2:<span th:text="${match.user2}"></span>
      user1Hand:<span th:text="${match.user1Hand}"></span>
      user2Hand:<span th:text="${match.user2Hand}"></span>
    </li>
  </ul>

  <a href="/janken">jankenへのGETをリクエスト</a><br>
</body>

</html>
