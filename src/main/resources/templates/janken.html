<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Janken</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Janken GAME!</h1>
  <p>Hi [[${loginUser}]]</p>

  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}"><a th:href="@{/match(id=${user.id})}">[[${user.name}]]</a></li>
  </ul>

  <h2>試合結果</h2>
  <div th:each="match : ${matches}">
    id:[[${match.id}]] user1:[[${match.user1}]] user2:[[${match.user2}]] user1の手:[[${match.user1Hand}]]
    user2の手:[[${match.user2Hand}]]
  </div>
</body>

</html>
