<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Match</h1>
  <h2>[[${loginUser}]] V.S. [[${opponent.name}]]</h2>
  <div>
    <a th:href="@{/fight(id=${opponent.id},hand='Gu')}">ぐー</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Choki')}">ちょき</a>
    <a th:href="@{/fight(id=${opponent.id},hand='Pa')}">ぱー</a>
  </div>
  <div th:if="${result != null}">
    <div>あなたの手 [[${myHand}]]</div>
    <div>相手の手 [[${cpuHand}]]</div>
    <div>結果 [[${result}]]</div>
  </div>
  <a href="/janken">もどる</a>
</body>

</html>
